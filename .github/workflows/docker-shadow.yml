# Temporary: an image of the shadow branch for a test deploy, with no release
# and no change to `latest`. Remove before merge.
name: docker-shadow

on:
  push:
    branches:
      - feat/shadow-query-engine

concurrency:
  group: docker-shadow
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish the shadow image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Image tag
        id: tag
        run: echo "image=subsquid/p2p-worker:shadow-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=shadow-amd64
          cache-to: type=gha,mode=max,scope=shadow-amd64
