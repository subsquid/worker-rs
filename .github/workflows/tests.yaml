name: Rust Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: 33.3
  ARCH: linux-x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-${{ runner.arch }}

      - name: Install protoc (if not cached)
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/protoc
          curl -L -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${ARCH}.zip"
          unzip -q /tmp/protoc.zip -d ~/.local/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  # MG-4: the PR conformance subset, kept as its own job so its wall clock is visible
  # against P-GATE-PR-TIME instead of hiding inside the unit-test run.
  conformance:
    name: Conformance (spec/13)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # P-GATE-PR-TIME
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-${{ runner.arch }}

      - name: Install protoc (if not cached)
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/protoc
          curl -L -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${ARCH}.zip"
          unzip -q /tmp/protoc.zip -d ~/.local/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"

      # The conformance corpus is generated, so LFS is not needed here.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run conformance suite
        run: cargo test --test conformance --all-features
      # Separate binary: the OB signals are process-global, so gauge assertions cannot
      # share a process with other query-running tests.
      - name: Run metrics conformance suite
        run: cargo test --test conformance_metrics --all-features
      # A gap test stays ignored until its fix lands (MG-8: failing-test-first, never a
      # silent skip). Listing them keeps any quarantine visible in the job log.
      - name: List quarantined gap tests
        run: |
          cargo test --test conformance --all-features -- --ignored --list
          cargo test --test conformance_metrics --all-features -- --ignored --list

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - uses: dsherret/rust-toolchain-file@v1
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-${{ runner.arch }}

      - name: Install protoc (if not cached)
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/protoc
          curl -L -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${ARCH}.zip"
          unzip -q /tmp/protoc.zip -d ~/.local/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
      - name: Fetch LFS files
        run: git lfs fetch --all && git lfs checkout
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious
